# Gera o projeto do Xcode com XcodeGen:  brew install xcodegen && xcodegen
# Antes de rodar no iPhone, troque PRODUCT_BUNDLE_IDENTIFIER por um ID único seu.
name: BenLoki
options:
  bundleIdPrefix: com.exemplo
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  MultiSessionWrapper:
    type: application
    platform: iOS
    sources:
      - path: MultiSessionWrapper
        excludes:
          - "Tests/**"
          - "README.md"
    info:
      path: MultiSessionWrapper/Info.plist
      properties:
        CFBundleDisplayName: BenLoki
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: Usada pelos serviços de chamada de vídeo nas suas contas.
        NSMicrophoneUsageDescription: Usada para mensagens de voz e chamadas nas suas contas.
        NSFaceIDUsageDescription: Protege suas contas contra acesso de outras pessoas.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.exemplo.benloki
        TARGETED_DEVICE_FAMILY: "1"
  MultiSessionWrapperTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MultiSessionWrapper/Tests
    dependencies:
      - target: MultiSessionWrapper
schemes:
  BenLoki:
    build:
      targets:
        MultiSessionWrapper: all
    test:
      targets:
        - MultiSessionWrapperTests
